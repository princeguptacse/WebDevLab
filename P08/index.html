<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P08 | Sticky Navbar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <span class="logo">Prince</span>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#cards">Cards</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section id="home" class="hero">
    <h1>Scroll down</h1>
    <p>The navbar stays on top while you scroll.</p>
  </section>

  <section id="cards" class="cards">
    <div class="card">
      <img src="https://picsum.photos/300/200?random=1" alt="Project one">
      <div class="overlay"><p>Project One</p></div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/300/200?random=2" alt="Project two">
      <div class="overlay"><p>Project Two</p></div>
    </div>
    <div class="card">
      <img src="https://picsum.photos/300/200?random=3" alt="Project three">
      <div class="overlay"><p>Project Three</p></div>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <p>princezzzzq@gmail.com</p>
  </section>

</body>
</html>
